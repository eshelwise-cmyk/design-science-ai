name: Repository Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f ATTRIBUTIONS.md
      - name: Check required directories
        run: |
          test -d design-science
          test -d photography
          test -d cinematography
          test -d image-generation
          test -d color-science
          test -d creator-workflows
